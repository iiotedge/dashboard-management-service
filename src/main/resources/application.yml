server:
  port: 8052

spring:
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  application:
    name: dashboard-management-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://localhost:5432/iotmining
    username: postgres
    password: 8506
    hikari:
      pool-name: LoginServicePool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 2000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
  # Spring Boot 4 serializes REST bodies with Jackson 3, whose defaults differ from the
  # Jackson 2 setup Boot 3 used (alphabetical property order, enums written and read via
  # toString(), null into primitives and trailing tokens rejected, java.util.Date with
  # "Z" instead of "+00:00"). This keeps the JSON the UI and other services see the
  # same as on Boot 3.
  jackson:
    use-jackson2-defaults: true

#minio:
#  url: http://localhost:9000
#  access-key: minioadmin
#  secret-key: minioadmin
#  bucket: iotmining-rms


feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

# Eureka Client
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://admin:8506@localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Local-dev-only fallback so this still boots without setting the env var -
# same key as auth-service/tenant-management-service's dev secret, required
# so JWTs issued by auth-service actually validate here too.
jwt:
  secret: ${JWT_SECRET_KEY_BASE64:Vlo2vcFdiXGgWqZLEpLw6kk99sH8/4odgC2XgZV0IbA=}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never